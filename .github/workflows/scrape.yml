name: Scrape

on:
  schedule:
    - cron: "17 8 * * *" # daily, off the hour to avoid GH Actions congestion
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Snapshot previous data file
        run: git show HEAD:data/municipalities.json > /tmp/previous.json 2>/dev/null || true

      - name: Run scraper
        run: npm run scrape

      - name: Check for substantive change
        id: diff
        run: |
          if node scraper/checkSubstantiveChange.js /tmp/previous.json data/municipalities.json; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Discard no-op write
        if: steps.diff.outputs.changed == 'false'
        run: git checkout -- data/municipalities.json

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        env:
          GIT_AUTHOR_NAME: ${{ vars.BOT_NAME || 'deflock-bot' }}
          GIT_AUTHOR_EMAIL: ${{ vars.BOT_EMAIL || 'deflock-bot@users.noreply.github.com' }}
          GIT_COMMITTER_NAME: ${{ vars.BOT_NAME || 'deflock-bot' }}
          GIT_COMMITTER_EMAIL: ${{ vars.BOT_EMAIL || 'deflock-bot@users.noreply.github.com' }}
        run: |
          git add data/municipalities.json
          git commit -m "Update municipalities data"
          git push
